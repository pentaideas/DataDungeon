name: Verify Java chapter packages

on:
  push:
    branches: [main]
    paths:
      - 'starter/**'
      - 'instructor/**'
      - 'docs/**'
      - 'verification/**'
      - '.github/workflows/verify-java.yml'
  pull_request:
    paths:
      - 'starter/**'
      - 'instructor/**'
      - 'docs/**'
      - 'verification/**'
      - '.github/workflows/verify-java.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compile and smoke test Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and check both starter projects
        run: python3 verification/verify_starters.py
      - name: Verify activity completion and Word listings
        run: python3 verification/verify_completion.py
